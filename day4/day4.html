    <!-- css- cascading style sheets
     it is a style sheet language that is used to describe
     the presentation of a webpage such as colors,texts,fonts,
     animations,layouts and responsivenes

     3 ways to insert css
     1) inline css
     styles are added to element itself using style attribute
     css is full of properties and values
     <h1 style='color:red;background:black'>heading 1</h1>
     2) internal css
     styles are added to the document using style tag in head section

     selectors 
     it is used to target the html elements for applying styles
    
      selector{
        property:vallue
       }
         h2{
        color:yellow;
        background:lightpink
      }

     <h2>heading 2</h2>

    


     3) external css
     styles are added to external css file that has extension .css
     and can be linked using link tag
     demo.css
     h3{
     color:red;
     }

     inline having high specificity
     based on how we define 


      types of selectors
      1) simple selectors
        a) tagname or element selector
        it targets the elements based on a tagname
        h1{
        color:red;
        }

        b) class selector
        class is denoted by .
        it is used to style the group of elements at once

        .el1{
        color:violet;
        }
        <div class='el1'>content </div>

        c) id selector
        it is denoted by #
        it is used to apply to styles uniquely
        #demo{
        color:green;
        }
        <h1 id='demo'>heading</h1>
      2) combinators
      3) pseudo class
    
     -->
