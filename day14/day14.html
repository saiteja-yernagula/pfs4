<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        code - 2ways
        1) synchronous code---high priority
         which executes line by line and doesn't take time


        2) asynchronous code
         which executes parallely and takes time
 console.log('one')
        setTimeout(()=>{
            console.log('two')
        },0)
        console.log('three')
         
         event loop mechanism
         1) call stack
         2) web api
         3) callback que
         4) event loop
        

         promises
         promises represents the eventual completion or failure of an asynchronous
         operation

         three state
         fullfilled
         rejected
         pending

         1) creating a promise
let prom=new Promise((res,rej)=>{
        let val=10
        if(val==10){
            res('promise is resolved')
        }else{
            rej('promise is rejected')
        }
       })
         2) consuming a promise
           a) then.catch
              prom.then((fullfilled)=>console.log(fullfilled))
           .catch((error)=>console.log(error))

           b) async await
          async function getprom(){
       let a=await prom//await -it pauses an execution until the promise is settled
       console.log(a)
       }
       getprom()


       fetch()
       it is used to make a network request(api call)
       it takes two parameter 1) api url 2) http methods - get ,post ,put,delete
       it returns a promise 

       to consume ----1) then catch  2) async await
       


        */
       fetch('https://fakestoreapi.com/products').then((res)=>res.json())
         .then((data)=>console.log(data))
         .catch((err)=>console.log(err))
      
       async function getdata(){
        let data=await fetch('https://jsonplaceholder.typicode.com/todos')
        let finaldata=await data.json()
        console.log(finaldata)
        }
        getdata()

       
    </script>
</body>
</html>
